<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单主页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      color: #1f2937;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    p {
      margin: 0 0 24px;
      font-size: 15px;
      line-height: 1.6;
      color: #4b5563;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      background: #3b82f6;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #2563eb;
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      margin-top: 18px;
      min-height: 24px;
      font-size: 15px;
      color: #059669;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>你好，欢迎</h1>
    <p>这是一个简单的主页，有一点内容，但不多。</p>
    <button id="greetBtn">点我一下</button>
    <div id="message"></div>
    <button id="greetBtn" hrre="https://github.com/X-yx-86/vp/tree/main">去我仓库</button>
  </main>

  <script>
    const btn = document.getElementById('greetBtn');
    const msg = document.getElementById('message');
    const greetings = [
      '今天也要开心呀。',
      '页面虽小，五脏俱全。',
      '随便来点，刚刚好。',
      '你好，世界。'
    ];

    btn.addEventListener('click', () => {
      const random = greetings[Math.floor(Math.random() * greetings.length)];
      msg.textContent = random;
    });
  </script>
</body>
</html>
